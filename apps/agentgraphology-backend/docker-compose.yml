version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agentgraphology-postgres
    environment:
      POSTGRES_DB: agentgraphology
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentgraphology

  # Ollama LLM Service (requires Docker with GPU support for full speed)
  ollama:
    image: ollama/ollama:latest
    container_name: agentgraphology-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    # Note: For GPU acceleration on NVIDIA, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - agentgraphology
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Initialize with mistral model
    entrypoint: sh -c 'ollama serve & sleep 5 && ollama pull mistral:7b-instruct && wait'

  # AgentGraphology Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentgraphology-api
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/agentgraphology
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: mistral:7b-instruct
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - agentgraphology
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: pgAdmin for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agentgraphology-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agentgraphology.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - agentgraphology
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  ollama_data:
  pgadmin_data:

networks:
  agentgraphology:
    driver: bridge
