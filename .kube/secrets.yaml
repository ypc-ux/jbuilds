apiVersion: v1
kind: Secret
metadata:
  name: agentgraphology-secrets
  namespace: agentgraphology
type: Opaque
stringData:
  # PostgreSQL credentials - REPLACE WITH YOUR VALUES
  postgres-password: "changeme-in-production"

  # Database connection string
  database-url: "postgresql://postgres:changeme-in-production@postgres:5432/agentgraphology"

  # GitHub token for API access (optional)
  github-token: ""

  # Add other secrets as needed
  # api-key: ""
  # webhook-secret: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: agentgraphology-config
  namespace: agentgraphology
type: Opaque
stringData:
  # Application configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  OLLAMA_MODEL: "mistral:7b-instruct"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgraphology-config
  namespace: agentgraphology
data:
  # Non-sensitive configuration
  OLLAMA_BASE_URL: "http://ollama-service:11434"
  API_PORT: "3001"
  CORS_ORIGIN: "https://your-domain.com"
