apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: agentgraphology
  labels:
    app: agentgraphology
    component: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentgraphology
      component: llm
  template:
    metadata:
      labels:
        app: agentgraphology
        component: llm
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - name: http
          containerPort: 11434
          protocol: TCP
        env:
        - name: OLLAMA_NUM_GPU
          value: "0"
        livenessProbe:
          httpGet:
            path: /api/tags
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tags
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama
      volumes:
      - name: ollama-models
        emptyDir:
          sizeLimit: 20Gi
      restartPolicy: Always
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
      initContainers:
      - name: pull-model
        image: ollama/ollama:latest
        command:
          - /bin/sh
          - -c
          - |
            echo "Pulling mistral model..."
            ollama pull mistral:7b-instruct || echo "Model pull failed, continuing..."
        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: agentgraphology
  labels:
    app: agentgraphology
    component: llm
spec:
  type: ClusterIP
  selector:
    app: agentgraphology
    component: llm
  ports:
  - name: http
    port: 11434
    targetPort: http
    protocol: TCP
