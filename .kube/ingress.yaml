apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgraphology-ingress
  namespace: agentgraphology
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.agentgraphology.com
    secretName: agentgraphology-tls
  rules:
  - host: api.agentgraphology.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: agentgraphology-api
            port:
              number: 3001
      - path: /health
        pathType: Exact
        backend:
          service:
            name: agentgraphology-api
            port:
              number: 3001

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgraphology-network-policy
  namespace: agentgraphology
spec:
  podSelector:
    matchLabels:
      app: agentgraphology
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3001
  - from:
    - podSelector:
        matchLabels:
          app: agentgraphology
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 11434
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: agentgraphology
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 11434
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
