apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgraphology-api
  namespace: agentgraphology
  labels:
    app: agentgraphology
    component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agentgraphology
      component: api
  template:
    metadata:
      labels:
        app: agentgraphology
        component: api
    spec:
      containers:
      - name: api
        image: agentgraphology-api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3001
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agentgraphology-secrets
              key: database-url
        - name: OLLAMA_BASE_URL
          value: "http://ollama-service:11434"
        - name: OLLAMA_MODEL
          value: "mistral:7b-instruct"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: agentgraphology-secrets
              key: github-token
              optional: true
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        volumeMounts:
        - name: logs
          mountPath: /var/log/agentgraphology
      volumes:
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: agentgraphology-api
  namespace: agentgraphology
  labels:
    app: agentgraphology
    component: api
spec:
  type: ClusterIP
  selector:
    app: agentgraphology
    component: api
  ports:
  - name: http
    port: 3001
    targetPort: http
    protocol: TCP
